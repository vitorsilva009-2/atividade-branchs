<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>

<body>

    <h1>Calculadora - Branchs &amp; Merges</h1>
    <div class="container">



        <div class="card">
            <h2>Funcionalidade 1 - Soma</h2>
            <div class="inputs">
                <input type="number" id="soma1" placeholder="Número 1">
                <input type="number" id="soma2" placeholder="Número 2">
            </div>
            <button onclick="somar()">Calcular</button>
            <p class="resultado" id="resultadoSoma"></p>
        </div>

        <div class="card">
    <h2>Funcionalidade 4 - Divisão</h2>
    <div class="inputs">
      <input type="number" id="div1" placeholder="Número 1">
      <input type="number" id="div2" placeholder="Número 2">
    </div>
    <button onclick="dividir()">Calcular</button>
    <p class="resultado" id="resultadoDiv"></p>
  </div>


        <div class="card">
            <h2>Funcionalidade 2 - Subtração</h2>
            <div class="inputs">
                <input type="number" id="sub1" placeholder="Número 1">
                <input type="number" id="sub2" placeholder="Número 2">
            </div>
            <button onclick="subtrair()">Calcular</button>
            <p class="resultado" id="resultadoSub"></p>
        </div>

    </div>
    <script src="js.js"></script>
</body>

</html>
